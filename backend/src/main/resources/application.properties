spring.application.name=rbac-auth
server.port=8080

# Database configurations (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:rbacdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Hibernate configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security & JWT keys
application.security.jwt.secret-key=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwMTIzNDU2Nzg5MA==
application.security.jwt.expiration=86400000
